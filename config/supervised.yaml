# FraudTrap — Supervised Learning Configuration
# Phase 2 & 3 Architecture Settings

# Phase 2: Semi-Supervised Configuration
semi_supervised:
  # TabPFN (Tabular Prior-data Fitted Network by Prior Labs)
  # A pretrained tabular foundation model that uses in-context learning
  # for prediction on small-to-medium labelled datasets.
  tabpfn:
    # Number of TabPFN estimators (ensemble size)
    n_estimators: 4
    
    # Ignore pretraining limits (allows larger datasets)
    ignore_pretraining_limits: true
    
    # Pseudo-labeling
    confidence_threshold: 0.8
    max_pseudo_ratio: 3.0
    
    # Calibration
    calibration_method: isotonic
    enable_calibration: true
  
  # Training pipeline
  training:
    # Minimum labeled samples to activate semi-supervised
    min_labeled_samples: 100
    
    # Maximum labeled samples before graduating to supervised
    max_labeled_samples: 10000
    
    # Class imbalance handling
    positive_weight: auto  # auto = compute from data
    
    # Monitoring
    enable_drift_detection: true
    enable_calibration_monitoring: true

# Phase 3: Supervised Configuration
supervised:
  # Champion: CatBoost + Specialist Routing
  champion:
    algorithm: catboost
    
    # CatBoost hyperparameters
    catboost:
      iterations: 1000
      depth: 6
      learning_rate: 0.05
      loss_function: Logloss
      eval_metric: AUC
      auto_class_weights: Balanced
      bootstrap_type: Bernoulli
      subsample: 0.8
      random_seed: 42
      early_stopping_rounds: 50
    
    # Specialist routing
    specialist:
      enabled: true
      
      # Confidence threshold for specialist invocation
      confidence_threshold: 0.9
      
      # Distance threshold for FT-Transformer
      distance_threshold: 0.5
      
      # Maximum FT-Transformer invocation rate (0-1)
      max_ft_invocation_rate: 0.2
      
      # Latency budget (ms) for specialist invocation
      latency_budget_ms: 30
  
  # FT-Transformer Specialist
  ft_transformer:
    # Architecture
    d_token: 64
    n_heads: 4
    n_layers: 2
    dropout: 0.1
    
    # Training
    n_epochs: 50
    batch_size: 256
    learning_rate: 0.001
    weight_decay: 0.0001
    
    # Early stopping
    patience: 10
    min_delta: 0.001
    
    # Device
    device: auto  # auto, cpu, cuda
    
    # Latency budget (ms)
    inference_latency_ms: 15
  
  # Meta-Fusion Layer
  meta_fusion:
    # Fusion method
    method: logistic_regression  # logistic_regression or gbdt
    
    # If using GBDT fusion
    gbdt:
      n_estimators: 50
      max_depth: 3
      learning_rate: 0.05
    
    # Training
    cv_folds: 5
    min_samples: 100
  
  # Confidence Estimator
  confidence:
    # Distance threshold for low confidence
    distance_threshold: 0.5
    
    # Conformal prediction
    enable_conformal: true
    conformal_alpha: 0.1  # 90% coverage
    
    # Calibration
    calibration_method: isotonic
  
  # Calibration
  calibration:
    method: isotonic
    enabled: true
  
  # Evaluation
  evaluation:
    metrics:
      - pr_auc
      - roc_auc
      - f2_score
      - precision
      - recall
      - f1
      - accuracy
      - fpr
      - calibration_error
      - brier_score
      - ft_invocation_rate
      - specialist_accuracy
    
    # Threshold analysis
    threshold_analysis:
      enabled: true
      n_thresholds: 9
      threshold_range: [0.1, 0.9]
    
    # Latency measurement
    latency:
      enabled: true
      n_samples: 1000
      warmup_samples: 10
  
  # Promotion criteria
  promotion:
    # Minimum PR-AUC improvement over champion
    min_pr_auc_improvement: 0.01
    
    # Maximum allowed FPR
    max_fpr: 0.01
    
    # Maximum allowed calibration error
    max_calibration_error: 0.05
    
    # Maximum allowed latency ratio (challenger/champion)
    max_latency_ratio: 2.0
    
    # Minimum validation samples
    min_validation_samples: 1000

# Challengers Configuration (offline benchmark only)
challengers:
  # Offline benchmark algorithms (not used in production)
  algorithms:
    - lightgbm
    - xgboost
  
  # LightGBM hyperparameters (offline benchmark)
  lightgbm:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    num_leaves: 63
    subsample: 0.8
    colsample_bytree: 0.8
    is_unbalance: true
    random_state: 42
  
  # XGBoost hyperparameters (offline benchmark)
  xgboost:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 3
    reg_alpha: 0.1
    reg_lambda: 1.0
    eval_metric: aucpr
    random_state: 42

# Training Pipeline Configuration
training_pipeline:
  # Output directory for training runs
  output_dir: models/supervised/training_runs
  
  # Model storage
  model_storage:
    base_dir: models/supervised/saved_models
    compression: true
    backup_count: 5
  
  # Scheduling (for automated training)
  scheduling:
    enabled: false
    cron: "0 2 * * 0"  # Weekly on Sunday at 2 AM
    max_concurrent_runs: 1
  
  # Monitoring
  monitoring:
    enabled: true
    log_level: INFO
    metrics_export: false

# Feature Store Integration
feature_store:
  enabled: true
  backend: redis  # redis or memory
  ttl_seconds: 3600  # 1 hour
  prefix: fraudtrap:features

# Audit and Logging
audit:
  enabled: true
  log_predictions: true
  log_feature_importance: true
  retention_days: 90
  
  # Audit storage
  storage:
    backend: redis  # redis, postgres, or s3
    redis_key: fraudtrap:audit
    max_entries: 100000

# Performance Limits
performance:
  # Maximum inference latency (ms)
  max_inference_latency_ms: 50
  
  # Maximum memory usage (MB)
  max_memory_mb: 4096
  
  # Thread pool size for parallel training
  training_workers: 4
  
  # Batch size for batch inference
  batch_size: 256

# Multi-Tenant Configuration
multi_tenant:
  enabled: true
  
  # Per-tenant settings
  per_tenant:
    # Whether to train separate models per tenant
    separate_models: true
    
    # Minimum samples per tenant before training
    min_samples: 10000
    
    # Maximum models per tenant
    max_models: 10
    
    # Model sharing between tenants
    model_sharing: false
