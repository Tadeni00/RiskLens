name: RiskLens Model CI/CD Pipeline

on:
  push:
    paths:
      - 'models/**'
      - 'training/**'
      - 'config/models/**'
      - 'scripts/train_*.py'
      - 'scripts/deploy_model.py'
      - 'scripts/register_model.py'
      - 'scripts/promote_or_rollback.py'
      - 'scripts/monitor_canary.py'
      - 'scripts/retrain*.py'
      - 'scripts/retrain_scheduler.py'
  pull_request:
    paths:
      - 'models/**'
      - 'training/**'
      - 'config/models/**'

env:
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
  MLFLOW_S3_ENDPOINT_URL: ${{ secrets.MLFLOW_S3_ENDPOINT_URL }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Stage 1: Code Quality & Unit Tests
  # ─────────────────────────────────────────────────────────────────
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements.gpu.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements.gpu.txt
          pip install pytest pytest-cov black isort flake8 mypy

      - name: Lint
        run: |
          black --check .
          isort --check-only .
          flake8 --max-line-length=120 .
          mypy --ignore-missing-imports .

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --cov=scoring --cov=models --cov=training --cov=features --cov=monitoring --cov-fail-under=80

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: true

  # ─────────────────────────────────────────────────────────────────
  # Stage 2: Model Training (GPU Runner)
  # ─────────────────────────────────────────────────────────────────
  train-model:
    name: Train & Evaluate Model
    needs: lint-and-test
    runs-on: [self-hosted, gpu, linux]  # Requires GPU runner
    timeout-minutes: 120
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    strategy:
      matrix:
        tenant: [bank_ng_gtb, bank_ke_equity, fintech_za_yoco]
        phase: [3]  # Only Phase 3 (Supervised) for CI
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements.gpu.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements.gpu.txt
          pip install mlflow

      - name: Configure MLflow
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_S3_ENDPOINT_URL: ${{ secrets.MLFLOW_S3_ENDPOINT_URL }}
        run: |
          mlflow set-tracking-uri ${{ secrets.MLFLOW_TRACKING_URI }}

      - name: Train model
        id: train
        run: |
          python -m training.pipeline \
            --tenant ${{ matrix.tenant }} \
            --phase ${{ matrix.phase }} \
            --n-optuna-trials 20 \
            --cv-folds 5 \
            --log-mlflow

      - name: Evaluate model
        id: evaluate
        run: |
          python -m training.evaluate \
            --tenant ${{ matrix.tenant }} \
            --model-path artifacts/models/${{ matrix.tenant }}/phase3 \
            --output evaluation_${{ matrix.tenant }}.json

      - name: Check performance thresholds
        id: thresholds
        run: |
          python scripts/check_thresholds.py \
            --input evaluation_${{ matrix.tenant }}.json \
            --min-pr-auc 0.75 \
            --min-recall 0.70 \
            --max-fpr 0.10 \
            --min-fraud-capture 0.80

      - name: Upload evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-${{ matrix.tenant }}
          path: evaluation_${{ matrix.tenant }}.json
          retention-days: 30

      - name: Register model in MLflow
        if: success()
        run: |
          python scripts/register_model.py \
            --tenant ${{ matrix.tenant }} \
            --model-path artifacts/models/${{ matrix.tenant }}/phase3 \
            --evaluation evaluation_${{ matrix.tenant }}.json \
            --mlflow-uri ${{ secrets.MLFLOW_TRACKING_URI }}

  # ─────────────────────────────────────────────────────────────────
  # Stage 3: Model Validation & Canary Deploy
  # ─────────────────────────────────────────────────────────────────
  canary-deploy:
    name: Canary Deploy (10% Traffic)
    needs: train-model
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download evaluation artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: evaluation-*
          path: evaluations/

      - name: Validate all evaluations passed
        run: |
          python scripts/validate_all_evaluations.py --dir evaluations/

      - name: Deploy canary (10% traffic)
        id: canary
        run: |
          python scripts/deploy_model.py \
            --mode canary \
            --traffic-percent 10 \
            --model-version ${{ github.sha }}

      - name: Monitor canary (10 minutes)
        id: monitor
        run: |
          python scripts/monitor_canary.py \
            --duration 600 \
            --max-error-rate 0.01 \
            --max-latency-p95 200 \
            --min-pr-auc 0.75

      - name: Promote or Rollback
        run: |
          if [ "${{ steps.monitor.outputs.success }}" == "true" ]; then
            echo "Canary successful - promoting to 100%"
            python scripts/promote_or_rollback.py --action promote
          else
            echo "Canary failed - rolling back"
            python scripts/promote_or_rollback.py --action rollback
          fi

  # ─────────────────────────────────────────────────────────────────
  # Stage 4: Full Production Deploy
  # ─────────────────────────────────────────────────────────────────
  production-deploy:
    name: Production Deploy
    needs: canary-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Full production deploy
        run: |
          python scripts/deploy_model.py \
            --mode production \
            --model-version ${{ github.sha }}

      - name: Post-deploy verification
        run: |
          python scripts/verify_deploy.py --timeout 300

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1.23.0
        with:
          channel-id: ${{ secrets.SLACK_DEPLOY_CHANNEL }}
          slack-message: |
            *RiskLens Model Deployed* 🚀
            Version: `${{ github.sha }}`
            Status: ${{ job.status }}
            <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>

  # ─────────────────────────────────────────────────────────────────
  # Stage 5: Automated Retraining Scheduler (Separate Workflow)
  # ─────────────────────────────────────────────────────────────────
  # Note: This runs on a schedule, not on push
  # See .github/workflows/retrain-scheduler.yml

  # ─────────────────────────────────────────────────────────────────
  # Stage 6: Drift Detection & Alerting (Separate Workflow)
  # ─────────────────────────────────────────────────────────────────
  # Note: This runs on a schedule, not on push
  # See .github/workflows/drift-monitor.yml