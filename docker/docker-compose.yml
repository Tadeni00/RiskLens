services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      zookeeper: { condition: service_healthy }
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 4gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.4
    ports:
      - "9000:9000"
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: fraudtrap
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fraudtrap
      POSTGRES_USER: fraudtrap
      POSTGRES_PASSWORD: fraudtrap
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudtrap"]
      interval: 5s
      timeout: 3s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/artifacts/mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_artifacts:/mlflow/artifacts

  # ── FraudTrap services ──────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      KAFKA_BROKERS: kafka:29092
      REDIS_HOST: redis
      CLICKHOUSE_HOST: clickhouse
      POSTGRES_URL: postgresql://fraudtrap:fraudtrap@postgres:5432/fraudtrap
      MLFLOW_TRACKING_URI: http://mlflow:5000
      TABPFN_TOKEN: ${TABPFN_TOKEN}
      PHASE1_MIN_FRAUD_LABELS: 5
      PHASE1_MIN_TRANSACTIONS: 20
      PHASE1_MIN_WEEKS: 0
      PHASE1_MIN_PR_AUC: 0.0
      PHASE2_MIN_FRAUD_LABELS: 15
      PHASE2_MIN_PR_AUC: 0.0
      LABEL_LAG_DAYS: 0
    volumes:
      - ../artifacts:/app/artifacts
    depends_on:
      kafka:  { condition: service_healthy }
      redis:  { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    ports:
      - "8501:8501"
    environment:
      ENVIRONMENT: production
      API_URL: http://api:8000
    volumes:
      - ../artifacts:/app/artifacts
    depends_on:
      - api
    restart: unless-stopped

  live_simulator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    command: >
      python scripts/simulate_live_data.py
      --api-url http://api:8000
      --rate 20.0
      --fraud-rate 0.04
    environment:
      ENVIRONMENT: production
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  sample_data:
    build:
      context: ..
      dockerfile: docker/Dockerfile.training
    command: >
      python scripts/generate_sample_data.py
      --rows 50000
      --fraud-rate 0.025
    volumes:
      - ../artifacts:/app/artifacts
    profiles: ["tools"]

  training_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.training
    command: >
      sh -c "while true; do
      python scripts/run_training.py;
      sleep 300;
      done"
    environment:
      ENVIRONMENT: production
      KAFKA_BROKERS: kafka:29092
      REDIS_HOST: redis
      CLICKHOUSE_HOST: clickhouse
      POSTGRES_URL: postgresql://fraudtrap:fraudtrap@postgres:5432/fraudtrap
      MLFLOW_TRACKING_URI: http://mlflow:5000
      TABPFN_TOKEN: ${TABPFN_TOKEN}
      PHASE1_MIN_FRAUD_LABELS: 5
      PHASE1_MIN_TRANSACTIONS: 20
      PHASE1_MIN_WEEKS: 0
      PHASE1_MIN_PR_AUC: 0.0
      PHASE2_MIN_FRAUD_LABELS: 15
      PHASE2_MIN_PR_AUC: 0.0
      LABEL_LAG_DAYS: 0
    volumes:
      - ../artifacts:/app/artifacts
      - tabpfn_cache:/root/.cache/huggingface
    depends_on:
      kafka: { condition: service_started }
      redis: { condition: service_healthy }
      mlflow: { condition: service_started }
    restart: unless-stopped

  label_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.training
    command: python ingestion/label_worker.py
    environment:
      ENVIRONMENT: production
      KAFKA_BROKERS: kafka:29092
      REDIS_HOST: redis
      CLICKHOUSE_HOST: clickhouse
      POSTGRES_URL: postgresql://fraudtrap:fraudtrap@postgres:5432/fraudtrap
      PHASE1_MIN_FRAUD_LABELS: 5
      PHASE1_MIN_TRANSACTIONS: 20
      PHASE1_MIN_WEEKS: 0
      PHASE1_MIN_PR_AUC: 0.0
      PHASE2_MIN_FRAUD_LABELS: 15
      PHASE2_MIN_PR_AUC: 0.0
      LABEL_LAG_DAYS: 0
    volumes:
      - ../artifacts:/app/artifacts
    depends_on:
      kafka: { condition: service_started }
      redis: { condition: service_healthy }
    restart: unless-stopped

volumes:
  clickhouse_data:
  postgres_data:
  mlflow_artifacts:
  tabpfn_cache:
